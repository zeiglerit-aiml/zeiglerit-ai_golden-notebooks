name: validate-notebook-archive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP integrity
        run: unzip -t zeigler-jupyter-notebook-collection.zip
      - name: Validate tracked notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No tracked notebooks found")

          for path in notebooks:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              if notebook.get("nbformat") != 4:
                  raise SystemExit(f"{path}: expected nbformat 4")
              cells = notebook.get("cells")
              if not isinstance(cells, list):
                  raise SystemExit(f"{path}: cells must be a list")

              code_cells = 0
              for index, cell in enumerate(cells):
                  kind = cell.get("cell_type")
                  source = cell.get("source", "")
                  source = "".join(source) if isinstance(source, list) else source
                  if kind == "code":
                      code_cells += 1
                      try:
                          ast.parse(source)
                      except SyntaxError as exc:
                          raise SystemExit(
                              f"{path}: code cell {index + 1}: {exc}"
                          ) from exc
                  elif kind not in {"markdown", "raw"}:
                      raise SystemExit(
                          f"{path}: cell {index + 1}: unsupported type {kind!r}"
                      )
              print(
                  f"Validated {path}: {len(cells)} cells, "
                  f"{code_cells} Python code cells"
              )
          PY
